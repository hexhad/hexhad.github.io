<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | hexhad</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" href="/src/favicon.png">
<script>
(function () {
  var d = document.documentElement, t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  d.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#f2f2f7' : '#000000';
})();
</script>
<style>
  /* Apple system colors (iOS 26 / macOS 26), same tokens as the main page */
  :root { --accent: #0091ff; --accent-text: #2997ff; --accent-fill: #0071e3; --bg: #000; --label: #fff; --label2: rgba(235,235,245,0.6); color-scheme: dark; }
  :root[data-theme="light"] { --accent: #0088ff; --accent-text: #0066cc; --bg: #f2f2f7; --label: #000; --label2: rgba(60,60,67,0.6); color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; color: var(--label);
    background: radial-gradient(60% 50% at 70% 30%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%), var(--bg);
  }
  main { max-width: 520px; }
  .logo { width: 44px; height: 44px; background: var(--accent); -webkit-mask: url(/src/itsmine.png) center / contain no-repeat; mask: url(/src/itsmine.png) center / contain no-repeat; margin-bottom: 28px; }
  code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.8rem; color: var(--accent-text); }
  h1 { font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1.02; letter-spacing: -0.02em; margin: 14px 0 16px; }
  p { color: var(--label2); line-height: 1.6; margin-bottom: 28px; }
  a { display: inline-block; background: var(--accent-fill); color: #fff; font-weight: 600; text-decoration: none; padding: 12px 22px; border-radius: 999px; transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1); }
  a:active { transform: scale(0.97); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"></div>
  <code>error 404: route not found</code>
  <h1>This screen isn't in the app.</h1>
  <p>The page you're looking for doesn't exist or has moved. The portfolio lives on one page.</p>
  <a href="/">Back to hexhad.github.io</a>
</main>
</body>
</html>
